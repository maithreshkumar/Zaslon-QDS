services:
  mysql-db:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: zaslon-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-zaslon_root_secure_password}
      MYSQL_DATABASE: ${DATABASE_NAME:-zaslon_qds}
      MYSQL_USER: ${DATABASE_USER:-zaslon_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-zaslon_secure_password}
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DATABASE_ROOT_PASSWORD:-zaslon_root_secure_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - zaslon-net

  quantum-service:
    build:
      context: ./quantum
      dockerfile: Dockerfile
    image: zaslon-quantum:latest
    container_name: zaslon-quantum
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - QUANTUM_HOST=0.0.0.0
      - QUANTUM_PORT=8001
      - CUDA_TARGET=${CUDA_TARGET:-default}
    ports:
      - "8001:8001"
    volumes:
      - ./quantum:/app
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - zaslon-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zaslon-backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-zaslon_qds_dev_secret_key_change_in_production_123456789}
      - DATABASE_HOST=mysql-db
      - DATABASE_PORT=3306
      - DATABASE_NAME=${DATABASE_NAME:-zaslon_qds}
      - DATABASE_USER=${DATABASE_USER:-zaslon_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-zaslon_secure_password}
      - QUANTUM_SERVICE_URL=http://quantum-service:8001
      - TELEPORTATION_COUNT=${TELEPORTATION_COUNT:-4096}
      - QUANTUM_BATCH_SIZE=${QUANTUM_BATCH_SIZE:-512}
      - VERIFICATION_SAMPLE_RATIO=${VERIFICATION_SAMPLE_RATIO:-0.05}
      - BASELINE_ERROR_RATE=${BASELINE_ERROR_RATE:-0.01}
      - FISHER_SIGNIFICANCE_ALPHA=${FISHER_SIGNIFICANCE_ALPHA:-0.01}
      - MISMATCH_THRESHOLD_RATIO=${MISMATCH_THRESHOLD_RATIO:-0.03}
      - REPLAY_WINDOW_SECONDS=${REPLAY_WINDOW_SECONDS:-300}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./quantum:/app/quantum:ro
    depends_on:
      mysql-db:
        condition: service_healthy
      quantum-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - zaslon-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zaslon-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
      - "5173:5173"
      - "5174:5174"
      - "5175:5175"
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - zaslon-net

volumes:
  mysql_data:
    driver: local

networks:
  zaslon-net:
    driver: bridge
